[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "megamoo"
# Keep in step with moo.globals.SERVER_VERSION; a test enforces it.
# PEP 440 spelling here, human spelling there.
version = "0.10.0b2"
description = "A programmable, persistent, multiplayer text world engine — the LambdaMOO model, with verbs written in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shan Hollen" }]
keywords = ["mud", "moo", "lambdamoo", "text-game", "multiplayer",
            "game-engine", "world-building", "interactive-fiction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
]

# No dependencies, and this is load-bearing rather than a boast: the
# engine runs on the standard library, so a world can be installed
# anywhere Python is without a build toolchain or a wheel to compile.
dependencies = []

[project.urls]
Homepage = "https://github.com/MalifaxLax/megamoo"
Source = "https://github.com/MalifaxLax/megamoo"

[project.scripts]
# The whole point of packaging: `megamoo run world.db` from any
# directory, with no PYTHONPATH and no copy of the engine beside the
# game.  Until this existed, every use of MegaMOO was a fork of it.
megamoo = "moo.cli:main"

[tool.setuptools]
# Only the engine is a package.  The starter world ships as *template
# data* under moo/templates/starter -- copied out by `megamoo init` into
# a directory the builder owns, never edited in place.  That distinction
# is the whole point: an engine that contains a game is an engine every
# user has to fork.
packages = ["moo", "moo.web"]

[tool.setuptools.package-data]
# The second verb pattern is not redundant: setuptools globs with
# glob.glob, which does not match leading-dot filenames, and a verb may
# legitimately be named `.` -- the repeat-last-command verb is stored as
# `verbs/15/..py`.  Without this it is dropped from the wheel silently,
# and a pip-installed `megamoo init` produces a game whose world knows
# about a verb that has no file behind it.
"moo" = [
    "templates/starter/world.db",
    "templates/starter/verbs/*/*.py",
    "templates/starter/verbs/*/.*.py",
    # The browser client.  Listed explicitly by depth rather than with a
    # recursive glob, because a missing pattern here does not fail the
    # build -- it produces a wheel that starts, reports the web client
    # listening, and answers 404.  That shipped in b0, b1 and b2.
    "web/client/*",
    "web/client/hosts/*",
    "web/client/vendor/wasmoon/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
