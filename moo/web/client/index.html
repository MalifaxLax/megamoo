<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MegaMOO</title>
<link rel="stylesheet" href="client.css">
</head>
<body>

<div id="app">

  <header id="topbar">
    <!-- The engine's own name, replaced at runtime by the world's when it
         has one (see WebServer._name_the_world, which rewrites <title>,
         and the brand code in client.js which follows it). Left as real
         markup rather than an empty placeholder so opening this file
         straight off disk still shows a finished header. -->
    <span class="brand" id="brand">Mega<span class="brand-accent">MOO</span></span>

    <!-- Shown when the files on disk change under a page that is still
         running the old ones. It lives in the header chrome, and stays
         there: as a banner of its own between the header and the stage
         it took a whole row, pushing the scrollback and the map down the
         moment it appeared. Persistent rather than a scrollback line,
         which would scroll away unread. -->
    <button id="stale-reload" type="button"
            class="topbar-button topbar-update" hidden
            title="This page is running superseded code">update &mdash; reload</button>

    <!-- The saved worlds of \con / \save, as a control rather than a
         command. A form, not a button with a click handler, so Enter in
         the field connects too -- the same reflex the input row trains.
         The datalist is filled from storage at attach and whenever the
         session book changes.

         Takes a bare handle for a saved world, or "<handle> <host>:<port>"
         to name a new one -- see parseWorldField. Note the port wanted
         here is the WebSocket one (8890 by default), not telnet's. -->
    <form id="world-row" class="world-row" autocomplete="off">
      <label class="world-label" for="world-name">World:</label>
      <input id="world-name" class="world-input" type="text" list="world-list"
             spellcheck="false" autocapitalize="none"
             placeholder="handle, or handle host:port"
             title="A saved world's name, or &quot;name host:port&quot; to add one (WebSocket port, e.g. 8890)"
             aria-label="World to connect to: a saved name, or name and host:port">
      <datalist id="world-list"></datalist>
      <button id="world-connect" type="submit" class="topbar-button">Connect</button>
    </form>

    <span class="topbar-right">
      <button id="scripts-open" type="button" class="topbar-button">Scripts</button>
      <span id="conn-status" class="status status--connecting">connecting</span>
    </span>
  </header>

  <main id="stage">

    <!-- Plain MUD output.  Lines arrive as pre-escaped HTML from
         moo/web/color.py, which is the only source of markup here. -->
    <section id="terminal-pane" aria-label="Game output">
      <div id="scrollback" role="log" aria-live="polite" aria-atomic="false"></div>
    </section>

    <!-- The left column: the world map, what you are carrying, then any
         script-declared panels. Still called "corner" in the CSS and here
         because that is where it started and renaming it would touch every
         script that positions a panel. -->
    <aside id="corner" aria-label="Overlays">

      <section id="automap" class="automap" aria-label="Map" hidden>
        <header class="automap-head">
          <span id="automap-room" class="automap-room"></span>
          <button id="automap-reset" type="button" class="automap-reset"
                  title="Forget the map">reset</button>
        </header>
        <canvas id="automap-canvas" role="img"
                aria-label="Map of rooms you have visited"></canvas>
      </section>

      <!-- Condition bars, from GMCP Char.Vitals. Directly under the map,
           where both are a fixed height and neither moves: these are read
           at a glance mid-fight, and a readout that has drifted down the
           column because a pack got fuller is one you have to find first.
           A world that defines no vitals_data verb sends nothing and this
           stays hidden -- the shipped starter is one of those. -->
      <section id="vitals" class="automap vitals" aria-label="Condition" hidden>
        <ul id="vitals-list" class="vit-list"></ul>
      </section>

      <!-- Panels declared by user scripts, rendered from a widget
           vocabulary by panels.js. Scripts never produce markup. -->
      <div id="script-panels" hidden></div>

      <!-- What the player is carrying, from GMCP Char.Inventory. Last,
           and given whatever height is left, because it is the one readout
           with no natural size -- a pack of nested containers can be any
           length. Its list scrolls inside itself rather than pushing the
           column, so a long inventory costs the map and the bars nothing.
           A world that defines no inv_data verb sends nothing, and this
           stays hidden -- the shipped starter world is one of those. -->
      <section id="inventory" class="automap" aria-label="Inventory" hidden>
        <header class="automap-head">
          <span class="automap-room">carrying</span>
        </header>
        <ul id="inventory-list" class="inv-list"></ul>
      </section>

    </aside>

  </main>

  <!-- Script manager. A <dialog> so Escape and focus trapping come for
       free rather than being reimplemented. -->
  <dialog id="scripts-dialog">
    <form method="dialog" class="dialog-close-form">
      <button class="dialog-close" aria-label="Close">&times;</button>
    </form>

    <h2 class="dialog-title">Scripts</h2>

    <ul id="scripts-list" class="scripts-list"></ul>

    <div class="script-editor">
      <div class="script-editor-row">
        <input id="script-name" type="text" placeholder="Script name"
               aria-label="Script name" autocomplete="off">
        <select id="script-language" aria-label="Language"></select>
      </div>
      <textarea id="script-source" rows="12" spellcheck="false"
                aria-label="Script source"
                placeholder="-- Lua, or JavaScript. The API is the same in both:&#10;--   moo.echo, moo.send, moo.trigger, moo.alias,&#10;--   moo.timer, moo.storage, moo.panel, moo.on"></textarea>
      <p id="script-warning" class="script-warning" hidden></p>
      <div class="script-editor-actions">
        <button id="script-save" type="button" class="button-primary">Save &amp; run</button>
        <button id="script-new" type="button">New</button>
      </div>
    </div>
  </dialog>

  <!-- A page pushed by verb code (GMCP Client.Page). A <dialog> so it can
       use the whole window rather than the width the readout column
       leaves, and so Escape and focus trapping come for free -- the same
       reasoning as the script manager above. Contents are rendered from
       the widget vocabulary by pages.js; nothing here is world markup. -->
  <dialog id="page-dialog" class="page-dialog">
    <form method="dialog" class="dialog-close-form">
      <button class="dialog-close" aria-label="Close">&times;</button>
    </form>
    <h2 id="page-title" class="dialog-title"></h2>
    <div id="page-body" class="page-body"></div>

    <!-- Keyboard buffer. A modal covers the main input row, so without
         this a page would be something you can only read and then close.
         Shown only when the page asks for it; what you type goes to the
         server exactly as the main input row would send it. -->
    <form id="page-input-row" class="page-input-row" autocomplete="off" hidden>
      <label for="page-cmd" class="page-prompt" aria-label="Prompt">&gt;</label>
      <input id="page-cmd" type="text" name="page-cmd"
             autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false"
             aria-label="Command input">
    </form>
  </dialog>

  <form id="input-row" autocomplete="off">
    <label for="cmd" id="prompt" aria-label="Prompt">&gt;</label>
    <input id="cmd" type="text" name="cmd"
           autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false"
           aria-label="Command input">
  </form>

</div>

<!-- Order matters: scripting.js defines the host registry the two hosts
     register into, and client.js boots everything once they are present.
     wasmoon itself is loaded lazily by the Lua host, only if a Lua script
     is actually enabled — it is ~420KB and most sessions never need it. -->
<script src="commands.js"></script>
<script src="automap.js"></script>
<script src="inventory.js"></script>
<script src="vitals.js"></script>
<script src="panels.js"></script>
<script src="pages.js"></script>
<script src="scripting.js"></script>
<script src="hosts/js-worker.js"></script>
<script src="hosts/lua.js"></script>
<script src="scripts-ui.js"></script>
<script src="client.js"></script>
</body>
</html>
