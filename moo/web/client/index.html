<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MegaMOO</title>
<link rel="stylesheet" href="client.css">
</head>
<body>

<div id="app">

  <header id="topbar">
    <span class="brand">Mega<span class="brand-accent">MOO</span></span>

    <!-- Shown when the files on disk change under a page that is still
         running the old ones. It lives in the header chrome, and stays
         there: as a banner of its own between the header and the stage
         it took a whole row, pushing the scrollback and the map down the
         moment it appeared. Persistent rather than a scrollback line,
         which would scroll away unread. -->
    <button id="stale-reload" type="button"
            class="topbar-button topbar-update" hidden
            title="This page is running superseded code">update &mdash; reload</button>

    <span class="topbar-right">
      <button id="scripts-open" type="button" class="topbar-button">Scripts</button>
      <span id="conn-status" class="status status--connecting">connecting</span>
    </span>
  </header>

  <main id="stage">

    <!-- Plain MUD output.  Lines arrive as pre-escaped HTML from
         moo/web/color.py, which is the only source of markup here. -->
    <section id="terminal-pane" aria-label="Game output">
      <div id="scrollback" role="log" aria-live="polite" aria-atomic="false"></div>
    </section>

    <!-- The left column: the world map, what you are carrying, then any
         script-declared panels. Still called "corner" in the CSS and here
         because that is where it started and renaming it would touch every
         script that positions a panel. -->
    <aside id="corner" aria-label="Overlays">

      <section id="automap" class="automap" aria-label="Map" hidden>
        <header class="automap-head">
          <span id="automap-room" class="automap-room"></span>
          <button id="automap-reset" type="button" class="automap-reset"
                  title="Forget the map">reset</button>
        </header>
        <canvas id="automap-canvas" role="img"
                aria-label="Map of rooms you have visited"></canvas>
      </section>

      <!-- What the player is carrying, from GMCP Char.Inventory. It sits
           under the map so the column the map reserves is doing work all
           the way down instead of holding empty space. Containers nest,
           with a triangle to fold them shut. A world that defines no
           inv_data verb sends nothing, and this stays hidden -- the
           shipped starter world is one of those. -->
      <section id="inventory" class="automap" aria-label="Inventory" hidden>
        <header class="automap-head">
          <span class="automap-room">carrying</span>
        </header>
        <ul id="inventory-list" class="inv-list"></ul>
      </section>

      <!-- Panels declared by user scripts, rendered from a widget
           vocabulary by panels.js. Scripts never produce markup. -->
      <div id="script-panels" hidden></div>

    </aside>

  </main>

  <!-- Script manager. A <dialog> so Escape and focus trapping come for
       free rather than being reimplemented. -->
  <dialog id="scripts-dialog">
    <form method="dialog" class="dialog-close-form">
      <button class="dialog-close" aria-label="Close">&times;</button>
    </form>

    <h2 class="dialog-title">Scripts</h2>

    <ul id="scripts-list" class="scripts-list"></ul>

    <div class="script-editor">
      <div class="script-editor-row">
        <input id="script-name" type="text" placeholder="Script name"
               aria-label="Script name" autocomplete="off">
        <select id="script-language" aria-label="Language"></select>
      </div>
      <textarea id="script-source" rows="12" spellcheck="false"
                aria-label="Script source"
                placeholder="-- Lua, or JavaScript. The API is the same in both:&#10;--   moo.echo, moo.send, moo.trigger, moo.alias,&#10;--   moo.timer, moo.storage, moo.panel, moo.on"></textarea>
      <p id="script-warning" class="script-warning" hidden></p>
      <div class="script-editor-actions">
        <button id="script-save" type="button" class="button-primary">Save &amp; run</button>
        <button id="script-new" type="button">New</button>
      </div>
    </div>
  </dialog>

  <form id="input-row" autocomplete="off">
    <label for="cmd" id="prompt" aria-label="Prompt">&gt;</label>
    <input id="cmd" type="text" name="cmd"
           autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false"
           aria-label="Command input">
  </form>

</div>

<!-- Order matters: scripting.js defines the host registry the two hosts
     register into, and client.js boots everything once they are present.
     wasmoon itself is loaded lazily by the Lua host, only if a Lua script
     is actually enabled — it is ~420KB and most sessions never need it. -->
<script src="commands.js"></script>
<script src="automap.js"></script>
<script src="inventory.js"></script>
<script src="panels.js"></script>
<script src="scripting.js"></script>
<script src="hosts/js-worker.js"></script>
<script src="hosts/lua.js"></script>
<script src="scripts-ui.js"></script>
<script src="client.js"></script>
</body>
</html>
